version: '3.8'
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme_admin_token}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hb_user}:${POSTGRES_PASSWORD:-hb_pass}@db:5432/${POSTGRES_DB:-healthbridge}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hb_pass}
      POSTGRES_DB: ${POSTGRES_DB:-healthbridge}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hb_user} -d ${POSTGRES_DB:-healthbridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
